<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Time Sheet Kehadiran Karyawan</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background-color: #27ae60; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #219150; }
        .btn-logout { background-color: #e74c3c; margin-top: 20px; }
        .btn-logout:hover { background-color: #c0392b; }
        .error { color: red; text-align: center; margin-top: 10px; font-weight: bold; }
        .loading { text-align: center; color: #2980b9; font-weight: bold; display: none; margin-top: 10px; }
        #dashboard-section { display: none; }
        .profile-box { background: #eafaf1; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 5px solid #27ae60; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #2c3e50; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .table-responsive { overflow-x: auto; }
    </style>
</head>
<body>

<div class="container">
    <!-- HALAMAN LOGIN -->
    <div id="login-section">
        <h2>Login Cek Time Sheet</h2>
        <div class="form-group">
            <label for="nik">NIK (Sesuai Database)</label>
            <input type="text" id="nik" placeholder="Contoh: 5432" required>
        </div>
        <div class="form-group">
            <label for="tgl_lahir">Tanggal Lahir</label>
            <input type="date" id="tgl_lahir" required>
        </div>
        <button onclick="prosesLogin()">Masuk / Cek Data</button>
        <div id="loading" class="loading">Sedang mengambil data...</div>
        <div id="error-msg" class="error"></div>
    </div>

    <!-- HALAMAN DASHBOARD DATA -->
    <div id="dashboard-section">
        <h2>Time Sheet Kehadiran Karyawan</h2>
        <div class="profile-box">
            <strong>Nama:</strong> <span id="disp-nama"></span><br>
            <strong>Jabatan:</strong> <span id="disp-jabatan"></span>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>HARI</th>
                        <th>TANGGAL</th>
                        <th>ABSEN</th>
                        <th>JAM_MASUK</th>
                        <th>JAM_PULANG</th>
                        <th>JAM_LEMBUR (Jam)</th>
                        <th>UANG_MAKAN</th>
                    </tr>
                </thead>
                <tbody id="tabel-body">
                    <!-- Data akan muncul otomatis di sini -->
                </tbody>
            </table>
        </div>

        <button class="btn-logout" onclick="logout()">Keluar (Logout)</button>
    </div>
</div>

<script>
    // TEMPELKAN LINK APPS SCRIPT ANDA DI BAWAH INI (DI DALAM TANDA KUTIP)
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxJM4W6bL5YtwQDo36ofW679lw5qJqMfvV6AbiLvnp6NvVsEMaSWp40DbSo7SBSRb46bQ/exec";

    function prosesLogin() {
        const nik = document.getElementById("NIK").value;
        const tglLahir = document.getElementById("tgl_lahir").value;
        const errorMsg = document.getElementById("error-msg");
        const loading = document.getElementById("loading");

        if (!nik || !tglLahir) {
            errorMsg.innerText = "Harap isi NIK dan Tanggal Lahir!";
            return;
        }

        errorMsg.innerText = "";
        loading.style.display = "block";

        // Mengirim permintaan ke Google Spreadsheet
        const urlLengkap = `${SCRIPT_URL}?nik=${encodeURIComponent(NIK)}&tgl_lahir=${encodeURIComponent(tglLahir)}`;

        fetch(urlLengkap)
            .then(response => response.json())
            .then(data => {
                loading.style.display = "none";
                if (data.status === "error") {
                    errorMsg.innerText = data.message;
                } else {
                    tampilkanDashboard(data);
                }
            })
            .catch(error => {
                loading.style.display = "none";
                errorMsg.innerText = "Terjadi kesalahan koneksi. Pastikan URL Apps Script benar.";
                console.error(error);
            });
    }

    function tampilkanDashboard(data) {
        document.getElementById("login-section").style.display = "none";
        document.getElementById("dashboard-section").style.display = "block";

        document.getElementById("disp-nama").innerText = data.user.nama;
        document.getElementById("disp-jabatan").innerText = data.user.jabatan;

        const tbody = document.getElementById("tabel-body");
        tbody.innerHTML = "";

        if (data.laporan.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6">Belum ada data HM atau lemburan.</td></tr>`;
            return;
        }

        data.laporan.forEach(item => {
            const row = `<tr>
                <td>${item.HARI}</td>
                <td>${item.TANGGAL}</td>
                <td>${item.ABSEN}</td>
                <td>${item.JAM_MASUK}</td>
                <td>${item.JAM_PULANG}</td>
                <td><strong>${item.JAM_LEMBUR}</strong></td>
                <td><strong>${item.UANG_MAKAN}</strong></td>
            </tr>`;
            tbody.innerHTML += row;
        });
    }

    function logout() {
        document.getElementById("nik").value = "";
        document.getElementById("tgl_lahir").value = "";
        document.getElementById("dashboard-section").style.display = "none";
        document.getElementById("login-section").style.display = "block";
    }
</script>

</body>
</html>
